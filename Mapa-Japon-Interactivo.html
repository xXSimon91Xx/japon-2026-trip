<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{--slate:#0F172A;--charcoal:#1E293B;--gold:#C9A86A;--cream:#F8FAFC;--muted:#64748B;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;background:var(--slate);color:var(--cream);}
  header{background:var(--slate);padding:10px 16px;border-bottom:2px solid var(--gold);display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  header h1{font-size:15px;margin:0;letter-spacing:.5px;}
  header h1 span{color:var(--gold);font-weight:400;}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;}
  .filters button{background:var(--charcoal);color:var(--cream);border:1px solid #334155;border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer;transition:.15s;}
  .filters button:hover{border-color:var(--gold);}
  .filters button.active{background:var(--gold);color:var(--slate);border-color:var(--gold);font-weight:600;}
  #map{height:calc(100vh - 116px);width:100%;background:#0F172A;}
  .legend{background:rgba(15,23,42,.94);color:var(--cream);padding:10px 12px;border-radius:8px;border:1px solid #334155;font-size:12px;line-height:1.65;max-width:230px;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .legend h3{margin:0 0 6px;font-size:12px;color:var(--gold);letter-spacing:.5px;border-bottom:1px solid #334155;padding-bottom:4px;}
  .legend .row{display:flex;align-items:center;gap:7px;}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto;border:1px solid rgba(255,255,255,.35);}
  .legend .cats{margin-top:7px;border-top:1px solid #334155;padding-top:6px;font-size:11.5px;color:#CBD5E1;}
  .popup-body{font-size:12.5px;line-height:1.5;max-width:240px;}
  .popup-body b{font-size:13px;}
  .popup-body .z{color:#64748B;font-size:11px;}
  .popup-body .h{color:#0F766E;font-weight:600;font-size:11.5px;}
  .popup-body .n{color:#334155;font-size:11.5px;}
  .popup-body .p{color:#B45309;font-weight:600;font-size:11.5px;}
  .leaflet-popup-content-wrapper{border-radius:10px;border-top:3px solid var(--gold);}
  footer{background:var(--slate);color:#94A3B8;font-size:11px;padding:6px 16px;border-top:1px solid #1E293B;display:flex;gap:16px;flex-wrap:wrap;}
  @media(max-width:640px){#map{height:calc(100vh - 170px);} header h1{font-size:13px;}}
</style>
</head>

  <span>💡 Requiere internet solo para CDN Leaflet + tiles OpenStreetMap</span>

const map = L.map('map', {zoomControl:true}).setView([35.45, 137.7], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

const markers = [];
SPOTS.forEach((s, i) => {
  const color = CITY_COLOR[s.city];
  const icon = L.divIcon({
    className: '',
    html: `<div style="background:${color};border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:22px;height:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5);">
             <span style="transform:rotate(45deg);font-size:11px;line-height:1;">${CAT_ICON[s.cat]||'📍'}</span>
           </div>`,
    iconSize: [22,22], iconAnchor: [11, 22], popupAnchor: [0, -20]
  });
  const price = s.precio ? `<div class="p">💰 ${s.precio}</div>` : '';
  const popup = `<div class="popup-body">
      <b>${CAT_ICON[s.cat]||''} ${s.name}</b>
      <div class="z">📍 ${s.zona}</div>
      ${s.horario ? `<div class="h">🕒 ${s.horario}</div>` : ''}
      ${price}
      ${s.nota ? `<div class="n">${s.nota}</div>` : ''}
    </div>`;
  const m = L.marker([s.lat, s.lng], {icon}).addTo(map).bindPopup(popup);
  m.city = s.city;
  markers.push(m);
});

// Leyenda
const legend = L.control({position:'bottomleft'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div', 'legend');
  let html = '<h3>LEGENDA</h3>';
  Object.entries(CITY_COLOR).forEach(([c, col]) => {
    html += `<div class="row"><span class="dot" style="background:${col}"></span>${c}</div>`;
  });
  html += '<div class="cats">';
  Object.entries(CAT_ICON).forEach(([k, e]) => { html += `<div class="row">${e} ${k}</div>`; });
  html += '</div>';
  div.innerHTML = html;
  return div;
};
legend.addTo(map);

// Filtro por ciudad
document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const city = btn.dataset.city;
  markers.forEach(m => {
    const show = city === 'all' || m.city === city;
    if(show && !map.hasLayer(m)) m.addTo(map);
    if(!show && map.hasLayer(m)) map.removeLayer(m);
  });
  if(city !== 'all') map.fitBounds(markers.filter(m => m.city === city).map(m => m.getLatLng()), {padding:[40,40]});
  else map.setView([35.45, 137.7], 6);
});
</script>
</body>
</html>
